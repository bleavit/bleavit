name: Fixed-point full differential sweep

on:
  pull_request:
    paths:
      - 'crates/futarchy-fixed/**'
      - 'crates/futarchy-primitives/**'
      - 'reference-model/src/**'
      - 'tools/reference-model/generate-vectors.py'
      - '.github/workflows/sweep.yml'
  push:
    branches: [main]
    paths:
      - 'crates/futarchy-fixed/**'
      - 'crates/futarchy-primitives/**'
      - 'reference-model/src/**'
      - 'tools/reference-model/generate-vectors.py'
      - '.github/workflows/sweep.yml'

permissions:
  contents: read

# Same reasoning as `ci.yml`, and it bites harder here: the sweep is a 90-minute
# job, so a branch pushed three times can hold three runners for an afternoon to
# answer a question about two trees nobody will merge. Never cancels on `main`,
# where each run is the record for its own commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  full-sweep:
    name: Full 10M-point exp/ln/cost sweep
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Generate the full deterministic reference sweep
        run: python3 tools/reference-model/generate-vectors.py --sweep-out release-work/sweep
      - name: Check every shard through futarchy-fixed
        env:
          BLEAVIT_SWEEP_DIR: release-work/sweep
          BLEAVIT_SWEEP_REQUIRE_FULL: '1'
        run: cargo test -p futarchy-fixed --release --locked --test sweep -- --ignored --nocapture
