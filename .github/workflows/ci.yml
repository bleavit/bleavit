name: CI

on:
  pull_request:
  push:
    branches: [main]

# Every job only checks out the tree and runs tests/validators — the token
# never needs write scopes (CodeQL: actions/missing-workflow-permissions).
permissions:
  contents: read

# Supersede in-flight runs of the same ref. Without this a branch that is pushed
# three times queues three full workspace builds that compete for the same
# runners, and only the last one's result can matter — the earlier two are
# answering a question about a tree nobody will merge. Never cancels on `main`:
# there each push is a distinct commit whose result is the record for that
# commit, not a draft superseded by the next one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    env:
      # Incremental artifacts roughly double the target size for no CI
      # benefit; stock runners have ~14 GB free against a ~35 GB build.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
      - name: Free runner disk space (the workspace build needs ~35 GB)
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev protobuf-compiler
      - name: Rust workspace, runtime wasm, and try-runtime gates
        run: tools/ci/rust-workspace-gates.sh

  fuzz:
    name: Fuzzing (15 §4.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-11-24
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.12.0 --locked
      - name: Run invariant fuzz gates
        run: tools/ci/fuzz-gates.sh

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check lockfiles, RustSec advisories, and GHSA-only advisories
        run: tools/ci/supply-chain-gates.sh

  reference-model:
    name: Reference model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install monitoring tooling dependency
        run: pip install pyyaml==6.0.2
      - name: Run reference model tests
        run: PYTHONPATH=reference-model/src python3 -m unittest discover -s reference-model/tests
      - name: Run economic-simulation tests
        run: PYTHONPATH=reference-model/src:simulation/src python3 -m unittest discover -s simulation/tests
      - name: Run tooling tests
        shell: bash
        run: |
          set -euo pipefail
          for suite in tools/deploy/tests tools/reference-model/tests tools/release/tests tools/phase-gates/tests tools/monitoring/tests tools/ci/tests; do
            if [[ -d "$suite" ]]; then
              python3 -m unittest discover -s "$suite"
            fi
          done
      - name: Check generated vector corpus
        run: python3 tools/reference-model/generate-vectors.py --check
      - name: Check normative LMSR documentation table
        run: python3 tools/reference-model/check-doc-table.py

  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check local Markdown links
        run: python3 tools/ci/check-doc-links.py
      - name: Check Markdown table structure (PLAN, living docs, spec)
        run: python3 tools/ci/check-plan-tables.py
      - name: Check spec-question batch index
        run: python3 tools/ci/check-spec-question-batches.py
      - name: Dispatch-check mirror — 09 §1.2 ↔ 11 §11.5 (15 §4.8)
        # Both documents mandated this diff and both credited it to doc 15, which
        # mandated nothing (SQ-552). It must fail on a frontend precondition with no
        # backend check behind it — a client refusing an action the runtime accepts.
        run: python3 tools/ci/check-dispatch-mirror.py
      - name: Bind the quickstart to the executable integration drill
        run: python3 tools/ci/check-quickstart-drill.py
      - name: Bind the pure-XCM integration page to the frozen client ABI
        run: python3 tools/ci/check-integration-abi.py
      - name: Check runbooks
        run: python3 tools/deploy/check-runbooks.py

  # S1 formal models — 15 §4.1; 03 §11.
  model-checking:
    name: Model checking (TLC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Check model-checking shell syntax
        run: |
          bash -n tools/verify/fetch-tla2tools.sh
          bash -n tools/verify/run-model-checks.sh
      - name: Run TLC over all committed models
        run: tools/verify/run-model-checks.sh

  # S1 property suites at the normative ≥10^6 case count — 15 §4.2–4.3; 03 §11.
  # The `containment` shard is PT-10 (15 §4.3), a runtime REPLAY property rather
  # than a proptest over a frame-free core: it does not read PROPTEST_CASES,
  # because each case is two full 22-block runtime replays. It carries its own
  # BLEAVIT_PT10_CASES knob and rides this job for the same reason the others
  # do — the reduced count runs in `cargo test --workspace`, the deep sweep runs
  # here.
  # Sharded per-crate across fresh parallel runners: a single combined run is
  # ~70-85 min and intermittently trips "runner lost communication"
  # (CPU/memory starvation on one marathon job). fail-fast: false so every
  # shard reports; the timeout turns a genuine hang into a clean failure long
  # before the 6 h default.
  property-suites:
    name: Property suites (full count)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [ledger, market, constitution, welfare, containment]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev protobuf-compiler
      - name: Run property suites at full case count
        run: tools/ci/property-gates.sh ${{ matrix.suite }}

  weights:
    name: Weight regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test weight regression gate
        run: python3 tools/ci/check-weight-regression.py --self-test
      - name: Check committed weight diffs
        run: python3 tools/ci/check-weight-regression.py
      # 15 §4.5: a hand-written term inside a generated weight file is deleted by
      # the next regeneration, and that reads as a *decrease* — the one shape the
      # growth-only gate above cannot see (SQ-490).
      - name: Check generated weight files hold only generated weights
        run: python3 tools/ci/check-generated-weights.py

  # Weight-drift gate (15 §4.5). The job keeps its `benchmark-smoke` id so branch
  # protection keeps resolving, but it is no longer a smoke test: it re-measures
  # every pallet and compares against the committed weights (SQ-490 item 4).
  benchmark-smoke:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # substrate-wasm-builder needs the Wasm runtime target on a clean runner.
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install native build dependencies
        # omni-bencher's dependency tree reaches litep2p, whose build script
        # needs `protoc`; the workspace build needs libclang (bindgen).
        run: sudo apt-get update && sudo apt-get install -y libclang-dev protobuf-compiler
      - name: Install FRAME omni-bencher
        run: cargo install --locked frame-omni-bencher --version 0.22.0
      - name: Build benchmark runtime Wasm
        run: cargo build --locked --release -p bleavit-runtime --features runtime-benchmarks
      - name: Re-measure every pallet and diff the committed weights
        # This step used to execute every benchmark and discard the results, so it
        # could see a benchmark that *crashes* and never one that *disagrees* with
        # the committed file. `check-weight-regression.py` cannot cover the gap
        # either: it diffs HEAD against the merge base, so it detects a
        # regeneration and never the absence of one. That gap shipped
        # `pallet_attestor::remove_for_cause` declaring 8 reads while performing
        # 261 (SQ-490).
        #
        # Running at 2x1 is sound for some functions and not others, and the tool
        # splits them on measured evidence rather than convenience. Constant-weight
        # functions agree exactly across fidelities (`pallet_attestor` 6/6,
        # `pallet_collator_selection` 2/2), so their storage totals are hard-gated
        # here — and that is the class the SQ-490 defect belonged to, so this cheap
        # run does catch the real thing. Component-bearing functions do NOT agree:
        # a 2-point fit can lose a linear term outright (`new_session`: worst-case
        # writes 100 at 50x20 against 3 at 2x1), so they are advisory here and are
        # gated by a matching-fidelity run at release time. ref_time is advisory
        # always (127% measured spread on unchanged code).
        #
        # `pallet_assets`' one unsatisfiable upstream fixture (its v2-migration
        # benchmark asserts an empty asset map, which the 02 §8 genesis USDC
        # registration breaks by design) no longer needs naming here: the tool
        # probes for it and carries it forward only because
        # tools/ci/weight-preservation.toml declares why an unverified weight for
        # that one function is acceptable.
        run: python3 tools/ci/regenerate-weights.py --check --steps 2 --repeat 1

  # B7 environment release artifacts — 15 §4.7; 02 §11.
  app:
    name: App (Track F)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # app/.nvmrc is the single home of the Node pin. It deliberately does NOT
          # live in tools/env/pins.env: that file is 15 §4.7's exact-key manifest for
          # digest-pinned *test-environment* binaries, and the app's build toolchain
          # is 12 §1.1. Putting it there conflated two specs and the env validator
          # was right to refuse it.
          node-version-file: app/.nvmrc
      - name: Enable corepack (pnpm pin comes from packageManager)
        working-directory: app
        # corepack reads `packageManager` from package.json, so the pin has exactly
        # one home and there is nothing to cross-check against.
        run: corepack enable && corepack install
      - name: Assert the Node pin and the engines range agree
        working-directory: app
        run: |
          set -euo pipefail
          pinned=$(cat .nvmrc)
          node -e "
            const {engines}=require('./package.json');
            const semver=process.argv[1];
            if(!engines?.node) { console.error('engines.node missing'); process.exit(1); }
            const [maj]=semver.split('.');
            if(!engines.node.includes(semver) && !engines.node.includes('>='+semver)) {
              console.error(\`.nvmrc \${semver} not admitted by engines.node \${engines.node}\`); process.exit(1);
            }
            console.log(\`.nvmrc \${semver} agrees with engines.node \${engines.node}\`);
          " "$pinned"
      - name: Install (frozen lockfile)
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build the project graph
        working-directory: app
        # `tsc -b` is the PRIMARY firewall gate: a forbidden import fails module
        # resolution here, it is not merely reported.
        run: pnpm run build
      - name: Package firewall (dependency-cruiser)
        working-directory: app
        run: pnpm run depcruise
      - name: Firewall witness — the rules MUST still be able to fail
        working-directory: app
        # A checker that can no longer detect anything reports success. This asserts
        # a known-forbidden edge is still caught; a silent config change that made
        # every rule vacuous once passed a full green run here.
        run: pnpm run depcruise:witness
      - name: Negative-compilation corpus (10 §10.2)
        working-directory: app
        # The only suite that tests the firewall REJECTS rather than that the app
        # works. Includes an anti-vacuity positive control.
        run: pnpm run test:firewall
      - name: Protocol math vs the reference corpus (04 §5, 15 §4.8)
        working-directory: app
        # Reads `reference-model/fixtures/vectors.json` in place — the single
        # generated artifact the backend certifies against too (04 §5, rule 1),
        # never a copy under `app/`. The suite fails closed if the corpus is
        # missing or if its exact integers lose precision on load.
        run: pnpm run test:protocol
      - name: Finalized<T> assertion gate (10 §2.1)
        working-directory: app
        run: pnpm run check:casts
      - name: Chain feed vs the runtime source (02 §11, F2)
        # The cheap per-commit half of the descriptor-drift gate: no build, no node.
        # Compares the committed feed against `construct_runtime!` and
        # `INTEGRATION_CONTRACT_VERSION` — the comparison whose absence let a stale
        # metadata blob sit in the tree for eleven days under green CI.
        run: python3 tools/ci/check-chain-feed.py
      - name: Descriptor drift — regenerate and byte-compare (02 §11 row 1)
        working-directory: app
        # `papi generate` is deterministic given (metadata, cliVersion), so the
        # committed descriptors must reproduce exactly. PAPI's own `generated.json`
        # check is not enough: it hashes the metadata *input* and never reads `dist/`.
        run: pnpm run descriptors:check
      - name: Mock-runtime fixture suites (02 §11 row 4, FE-R1)
        working-directory: app
        # Replays the recorded chainHead transcripts and asserts FE-R1's bounds
        # against 02 §9's frozen table — not against the recording, which would
        # prove nothing.
        run: pnpm run test:mock-runtime
      - name: Two ledger domains, never merged (10 §11, 11 §11.2a)
        working-directory: app
        # Reads the boundary from the recorded `ConditionalLedger::ServiceIdBase`
        # metadata constant rather than spelling `1n << 63n` — the same no-hardcode
        # rule 10 §5.4 applies to every chain value, and the reason v23 gave the
        # boundary a metadata home. A suite carrying the literal would keep passing
        # after the chain moved it.
        run: pnpm run test:chain-client

      - name: CRITICAL_SURFACE and the supported-runtime map vs their sources (10 §5.1, §5.4)
        # Both are *generated* claims about frozen artifacts. `CRITICAL_SURFACE` re-derives
        # from `tools/release/surface-manifest.json`; `SUPPORTED_RUNTIMES` is compared in
        # both directions against `app/fixtures/chain-feed/`, so a stale metadata hash or
        # half a primary/recovery pair is a build failure rather than a runtime surprise.
        working-directory: app
        run: pnpm run surface:check

      - name: Compatibility classifier (10 §5.2, §3.2)
        # The classifier decides whether the app may sign, so what it is tested on is the
        # probe outcomes a healthy chain never produces — which is why it is a pure
        # function over probe results with the PAPI shape adapted separately.
        working-directory: app
        run: pnpm run test:descriptors

      - name: Tx machine, the gate and the signer boundary (11 §11.3–§11.4)
        # 11 §11.4 rule 1 asks for "structurally (the tx machine has no bypass edge), not
        # by convention", so what this asserts is mostly the shape of the state space:
        # which states can reach a signer, and what a GatePassed costs to obtain.
        working-directory: app
        run: pnpm run test:tx

      - name: smoldot artifact budget (10 §9.3, FE-P4)
        # A budget nothing measures is a sentence, and the one certain thing about a
        # dependency's compressed size is that it changes. Fails closed if the pinned
        # package's layout moved, so a version bump cannot measure nothing and pass.
        working-directory: app
        run: pnpm run check:budget

      - name: Foreign-chain feed vs the pinned Asset Hub runtime (02 §7.7, F4)
        # `check-chain-feed.py` cannot do this job: it reads metadata v15 obtained by
        # booting the runtime in `bleavit-node`, and a foreign runtime has neither the
        # genesis config nor the pallets that node expects. This reads the wasm through
        # PAPI's own decoder instead — which is also the better home, since what must be
        # proven present is what the *client* can name, and the client names what that
        # decoder produces. 10 §5.2's foreign verdict probes exactly `FOREIGN_SURFACE`,
        # so a surface that quietly left the upstream runtime would make the verdict
        # unable to fail on it: SQ-580's defect reached across a chain boundary.
        working-directory: app
        run: pnpm run foreign:check

      - name: Optional-provider health, sampling and quotas (10 §8)
        # INV-FE-3/15. Any mismatch auto-disables — §8.3 sets no threshold, and a
        # threshold is what turns one caught lie into a tolerated error rate.
        working-directory: app
        run: pnpm run test:providers

      - name: Release self-check and the verification panel (10 §5.4, 12 §1)
        working-directory: app
        run: pnpm run test:verify

      - name: Local index — coverage, provenance and ingest (10 §6–§7)
        # INV-FE-7. The load-bearing rule is 10 §6.3's "never silently spliced": a merged
        # range must claim ONE origin, so joining ranges of different provenance either
        # promotes provider blocks to verified or demotes verified ones. Neither is
        # available, so the boundary has to survive to be rendered.
        working-directory: app
        run: pnpm run test:local-index

      - name: Handoff formats — contexts, intents, receipts (10 §13, 11 §11.14)
        # D-21's three serverless formats. Closed action vocabulary, no bytes-typed
        # field, limits that only ever narrow.
        working-directory: app
        run: |
          pnpm run test:contexts
          pnpm run test:intents
          pnpm run test:receipts
          pnpm run test:llm-handoff

      - name: Handoff carries no network primitive (D-21)
        # The firewall proves `handoff` cannot IMPORT a network primitive; this proves
        # the emitted JS contains none, which is the claim INV-FE-6 actually makes. The
        # witness leg is not optional: V-86 found three CI-fatal firewall rules that
        # could never fire, so a handoff gate that cannot fail is the established
        # failure mode here rather than a hypothetical one.
        working-directory: app
        run: |
          pnpm run check:handoff-network
          pnpm run check:handoff-network:witness
          pnpm run check:handoff-emitted
          pnpm run check:handoff-emitted:witness

      - name: Generated schemas and skills reproduce (10 §13, F20/F21)
        # Both are generated artifacts committed to the tree, so the gate is that
        # regeneration is a no-op. Never the `:generate` scripts — a `--write` step in
        # CI would rewrite the artifact it is supposed to be comparing and pass always.
        working-directory: app
        run: |
          pnpm run schemas:check
          pnpm run skills:check
      - name: Render provenance and the never-defer facts (INV-FE-9, 11 §11.2)
        working-directory: app
        # The `ui` layer. Rendered headlessly with `react-dom/server`, because every
        # property here is about what the markup says. The two that fail silently: a
        # badge that renders empty (which no happy-path test distinguishes from a
        # badge that renders), and a meaning-changing fact wrapped in a `<details>`
        # by a later layout change — 11 §11.2 constraint 3 names five of those and
        # this suite binds the list to the section citations in doc 11 itself.
        run: pnpm run test:ui
      - name: The default surface — S1, S2, confirm, S21/S22 (11 §11.2–§11.5, §11.14)
        working-directory: app
        # Includes the 11 §11.2 constraint-1 check that matters most: with the
        # handoff surfaces DISABLED (the 15 §4.8 no-infrastructure posture) every
        # other screen is still reachable, and the client still has a front door.
        # "Demoting a surface is permitted; removing one is not."
        run: pnpm run test:screens
      - name: Every meaning-changing fact has an emitter (11 §11.2 constraint 3)
        working-directory: app
        # The defect class this repository keeps rediscovering: a control defined and
        # unreachable. FE-HANDOFF-012 shipped with zero emitting call sites, and no green
        # run distinguishes that from a code that never fires. These five facts are the
        # highest-consequence instance — each changes the meaning of a signature — and each
        # has exactly one call site, so losing one would leave every existing test passing.
        # Facts with no emitter yet are DECLARED with the milestone that will supply one,
        # and a stale declaration fails, so the promise cannot become a permanent excuse.
        run: pnpm run check:above-fold
      - name: Chain values reach the screen with their badge (10 §2.1 / INV-FE-9)
        # The other half of the provenance control, and the half `Verified<T>` cannot enforce:
        # `<Panel title={`Referendum ${id.value}`}>` typechecks perfectly and puts a chain
        # read on screen with no badge beside it. Rule A catches a `Verified<T>` payload
        # reaching a display position; rule B catches a derived value wearing another read's
        # status, which promotes provider data to verified by arithmetic. Type-aware on
        # purpose — a syntactic version fires on `key={...}`, on `event.currentTarget.value`
        # and on the release-constant rows of the verification panel, and a gate that fires
        # on correct code gets switched off rather than fixed. The witness leg proves both
        # rules can still fire, asserts the negative controls stay silent, and checks that
        # the fixture's own imports resolve — an unresolved type reference still prints as
        # `Verified<string>` while carrying no members, so the whole gate would inspect
        # nothing and report only "did not fire".
        working-directory: app
        run: pnpm run check:render-provenance && pnpm run check:render-provenance:witness

      - name: No markup or code sinks anywhere in app source (11 §11.8.1)
        # Evidence is bytes an adversary chose, displayed inside the console operated by the
        # system's most privileged actors; 10 §13.2's imported documents are the same shape
        # from another direction. §11.8.1's "rendered as text/structured data only, never
        # HTML" is not enforceable by a type — `evidence.text` is a `string` and
        # `dangerouslySetInnerHTML={{ __html: text }}` typechecks perfectly. The sink list is
        # closed rather than a pattern, because "anything ending in HTML" fires on
        # `escapeHtml`/`parseHtml` and gets switched off. AST-based, so a sink named inside a
        # comment or a string literal is simply not a property access. The witness proves each
        # form is still detectable and that the near-miss controls stay silent.
        working-directory: app
        run: pnpm run check:no-html-sinks && pnpm run check:no-html-sinks:witness

      - name: No hardcoded chain value (10 §5.4)
        # Two rules, because either alone is blind or useless. Rule A catches a frozen
        # constant's NAME bound to a numeric literal — `const MAX_POSITIONS_PER_ACCOUNT =
        # 64` is the defect in its purest form and stays a defect when the value is
        # currently right, which is exactly what a value scan waves through. Rule B catches
        # a distinctive frozen value appearing bare, and is deliberately restricted to
        # values of four digits or more: `32` and `64` are hash widths and array sizes on
        # every other line, so an unrestricted value rule fires constantly on nothing and
        # gets switched off. The witness leg is the anti-vacuity half — both rules are run
        # against a fixture that violates them and must fire.
        working-directory: app
        run: pnpm run check:chain-literals && pnpm run check:chain-literals:witness

      - name: Release pipeline and its bundle controls (12 §1, §5; F11)
        # Builds the tree and runs every distribution gate over it, per commit. A release
        # pipeline that only runs at a tag is a release pipeline first debugged during a
        # release. It is fail-closed in the direction that matters: the connect-src
        # allowlist is DERIVED from declared sources and diffed against the incumbent
        # (15 §4.8), so an addition fails the build rather than arriving one release at a
        # time (D-21); an unsubstituted CSP or service-worker asset map fails rather than
        # shipping a control that was silently not applied; and the emitted chunks are
        # scanned for a test-only signer, which is the one 10 §10.1 rule dependency-cruiser
        # structurally cannot answer because it is about the bundle, not the import graph.
        # The build's own readiness blockers are reported and do not fail this job —
        # `--production` is the gate that refuses while any stand.
        working-directory: app
        run: |
          pnpm run release:build
          # Re-reads the tree the line above emitted, in the SAME step: `dist/`
          # exists only within it, so a separate step would scan nothing and pass.
          pnpm run release:check

      - name: Release suite (12 §1, §5.2–§5.3; F11/F13)
        working-directory: app
        run: pnpm run test:release

      - name: Signer disjointness (12 §2.2, D-16; F13)
        # `ArNS controllers ∩ release signers = ∅`, evaluated over **natural persons**. The
        # key-id reading of that intersection would pass unconditionally and forever — a
        # minisign key id is never also an Arweave address — which is why §2.2 point 1
        # requires every key to be mapped to a stable operator before point 2 can mean
        # anything, and why an unmapped key is refused rather than skipped. Pre-ceremony the
        # registry is empty and declares a phase gate, which this reports as *unseated*
        # rather than as a passing separation; `--strict`, what a release gate runs, still
        # fails on it.
        working-directory: app
        run: pnpm run signers:audit

  environments:
    name: Environment definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install environment validator dependencies
        run: pip install pyyaml==6.0.2 websockets==15.0.1
      - name: Compile environment tooling
        run: python3 -m py_compile tools/env/*.py tools/env/tests/*.py
      - name: Run environment validator tests
        run: python3 -m unittest discover -s tools/env/tests
      - name: Run monitoring tests and alert-coverage gate
        run: |
          python3 -m unittest discover -s tools/monitoring/tests
          python3 tools/monitoring/check_alert_coverage.py
      - name: Validate committed environment definitions
        run: python3 tools/env/validate-environments.py
      - name: Check environment shell syntax
        run: |
          bash -n tools/env/fetch-binaries.sh
          bash -n tools/env/generate-relay-specs.sh
      - name: Check Zombienet JavaScript helpers
        run: |
          for helper in zombienet/drills/js/*.js; do
            node --check "$helper"
          done

  # S3 generated rate-limit/meter/bound coverage — 15 §4.6; I-22.
  limit-coverage:
    name: Generated limit coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run limit-coverage checker tests
        run: python3 -m unittest discover -s tools/limit-coverage/tests
      - name: Validate registry classifications and Rust test markers
        run: python3 tools/limit-coverage/check-limit-coverage.py
