# N10 client-para topology with no return HRMP channel — 16 §12 / 15 I-36.
# The client can send the positional ingress, but Bleavit cannot push a report
# back. The egress failure must stay outside welfare/XCM-health accounting.
[settings]
provider = "native"
timeout = 120000
node_spawn_timeout = 300

[relaychain]
chain = "paseo-local"
chain_spec_path = "zombienet/specs/out/paseo-local.json"
default_command = "zombienet/bin/polkadot"
default_args = ["--no-hardware-benchmarks"]

[[relaychain.nodes]]
name = "relay-alice"
validator = true

[[relaychain.nodes]]
name = "relay-bob"
validator = true

[[relaychain.nodes]]
name = "relay-charlie"
validator = true

[[relaychain.nodes]]
name = "relay-dave"
validator = true

[[parachains]]
id = 4242
chain_spec_path = "zombienet/specs/out/bleavit-drill.json"
cumulus_based = true

[[parachains.collators]]
name = "bleavit-collator-1"
command = "target/release/bleavit-node"

[[parachains.collators]]
name = "bleavit-collator-2"
command = "target/release/bleavit-node"

[[parachains.collators]]
name = "bleavit-collator-3"
command = "target/release/bleavit-node"

[[parachains]]
id = 4343
chain_spec_path = "zombienet/specs/out/bleavit-client-local.json"
cumulus_based = true

[[parachains.collators]]
name = "client-collator-1"
command = "target/release/bleavit-node"

[[parachains.collators]]
name = "client-collator-2"
command = "target/release/bleavit-node"

[[hrmp_channels]]
sender = 4343
recipient = 4242
max_capacity = 8
max_message_size = 524288
