# N10 client-para topology with no return HRMP channel — 16 §12 / 15 I-36.
# The client can send the positional ingress, but Bleavit cannot push a report
# back. The egress failure must stay outside welfare/XCM-health accounting.
[settings]
provider = "native"
timeout = 120000
node_spawn_timeout = 300

[relaychain]
chain = "paseo-local"
chain_spec_path = "zombienet/specs/out/paseo-local.json"
default_command = "zombienet/bin/polkadot"
default_args = ["--no-hardware-benchmarks"]

[[relaychain.nodes]]
name = "relay-alice"
validator = true

[[relaychain.nodes]]
name = "relay-bob"
validator = true

[[relaychain.nodes]]
name = "relay-charlie"
validator = true

[[relaychain.nodes]]
name = "relay-dave"
validator = true

[[parachains]]
id = 4242
chain_spec_path = "zombienet/specs/out/bleavit-drill.json"
cumulus_based = true

[[parachains.collators]]
name = "bleavit-collator-1"
command = "target/release/bleavit-node"
# The closing try-state endpoint (15 §1). `zombienet_rpc_uri` refuses a topology
# pinning none, so this drill failed closed from the day it was written.
#
# It is pinned on the BLEAVIT collator and on no other node, for two reasons. The
# resolver requires exactly one distinct value, so a second pin makes the endpoint
# ambiguous and refuses again. And the closing check is `try-runtime ... --checks
# try-state` against the Bleavit runtime, so the client parachain is the wrong node
# to attest even when it answers.
#
# Same value as every other topology, deliberately: networks spawn one at a time, and
# `require_free_zombienet_ports` scopes duplicates per file for that reason (F27).
rpc_port = 19944

[[parachains.collators]]
name = "bleavit-collator-2"
command = "target/release/bleavit-node"

[[parachains.collators]]
name = "bleavit-collator-3"
command = "target/release/bleavit-node"

[[parachains]]
id = 4343
chain_spec_path = "zombienet/specs/out/bleavit-client-local.json"
cumulus_based = true

[[parachains.collators]]
name = "client-collator-1"
command = "target/release/bleavit-node"

[[parachains.collators]]
name = "client-collator-2"
command = "target/release/bleavit-node"

# HRMP channels are opened AFTER both paras are producing blocks, by
# `zombienet/drills/js/open-hrmp-channels.js`, not by `[[hrmp_channels]]` here
# (SQ-567). See that helper's header comment for the derivation: a genesis
# preopen queues DMP notifications stamped `sent_at = 0`, which cumulus's
# first-candidate sentinel drops wholesale, trapping `set_validation_data` so the
# parachain never produces block #1. Channel geometry (capacity 8, 524288 bytes)
# is unchanged and now lives in the helper.
#
# This topology is the I-36 witness: the client->Bleavit direction ONLY, with the
# return channel deliberately absent. The drill MUST run the helper with
# "4343:4242" — and must never add the reverse direction.
