# Bleavit XCM drill topology — 15 §4.7; 02 §8/§11; 09 §4/§6.1/§7.1.
[settings]
provider = "native"
# Accommodates the real 4,800-relay-block dead-man threshold in drill 05.
# Accommodates the ≈57,600 s half-authority relay-finality stall of drill 05.
timeout = 120000
node_spawn_timeout = 300

[relaychain]
chain = "paseo-local"
chain_spec_path = "zombienet/specs/out/paseo-local.json"
default_command = "zombienet/bin/polkadot"
default_args = ["--no-hardware-benchmarks"]

[[relaychain.nodes]]
name = "relay-alice"
validator = true

[[relaychain.nodes]]
name = "relay-bob"
validator = true

[[relaychain.nodes]]
name = "relay-charlie"
validator = true

[[relaychain.nodes]]
name = "relay-dave"
validator = true

[[parachains]]
id = 4242
chain_spec_path = "zombienet/specs/out/bleavit-drill.json"
cumulus_based = true

[[parachains.collators]]
name = "bleavit-collator-1"
command = "target/release/bleavit-node"
# The closing try-state endpoint (15 §1). `zombienet_rpc_uri` refuses a topology
# pinning none, because a randomly allocated port cannot be addressed and guessing
# one would attest try-state against the wrong node — so drill 07 failed closed here
# from the day it was written, as `zombienet/README.md` already recorded.
#
# It stays the ONLY pinned `rpc_port` in this file, and that is a constraint rather
# than a preference: the resolver requires exactly one distinct value, so pinning the
# Asset Hub collator too would make the endpoint ambiguous and refuse again. Nothing
# needs it to be pinned — a drill helper reads any node's endpoint from
# `networkInfo.nodesByName[name].wsUri`, and the light-client harness takes its
# bootnodes from `system_localListenAddresses`, which carries the peer id a fixed
# port does not.
#
# 19944 is deliberately the same value the keeper topologies use. Networks spawn one
# at a time, and `require_free_zombienet_ports` scopes duplicates per file for that
# reason (F27).
rpc_port = 19944

[[parachains.collators]]
name = "bleavit-collator-2"
command = "target/release/bleavit-node"

[[parachains.collators]]
name = "bleavit-collator-3"
command = "target/release/bleavit-node"

[[parachains]]
id = 1000
chain_spec_path = "zombienet/specs/out/asset-hub-paseo-local.json"
cumulus_based = true

[[parachains.collators]]
name = "asset-hub-collator-1"
command = "zombienet/bin/polkadot-parachain"

[[parachains.collators]]
name = "asset-hub-collator-2"
command = "zombienet/bin/polkadot-parachain"

[[parachains]]
id = 1005
chain_spec_path = "zombienet/specs/out/coretime-paseo-local.json"
cumulus_based = true

[[parachains.collators]]
name = "coretime-collator-1"
command = "zombienet/bin/polkadot-parachain"

[[parachains.collators]]
name = "coretime-collator-2"
command = "zombienet/bin/polkadot-parachain"

# HRMP channels are opened AFTER both paras are producing blocks, by
# `zombienet/drills/js/open-hrmp-channels.js`, not by `[[hrmp_channels]]` here
# (SQ-567). Zombienet's directive preopens them in the relay genesis, which
# queues DMP notifications stamped `sent_at = 0`; cumulus's first-candidate
# sentinel is also `{sent_at: 0}`, so it drops every one of them, rebuilds an
# empty MQC head and traps `set_validation_data` — the parachain never produces
# block #1. That helper's header comment carries the full derivation with source
# line references. Channel geometry (capacity 8, 524288 bytes) is unchanged and
# now lives in the helper.
#
# The drill spawning this topology MUST run the helper with "4242:1000,1000:4242"
# after both collators report a block height.
