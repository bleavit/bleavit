[package]
name = "pallet-question-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
futarchy-primitives = { path = "../../crates/futarchy-primitives", default-features = false }
question-service-core = { path = "../../crates/question-service-core", default-features = false }
pallet-client-registry = { path = "../client-registry", default-features = false }
pallet-conditional-ledger = { path = "../conditional-ledger", default-features = false }
pallet-market = { path = "../market", default-features = false }
parity-scale-codec = { version = "3.7.5", default-features = false, features = ["derive", "max-encoded-len"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
frame-support = { workspace = true }
frame-system = { workspace = true }
frame-benchmarking = { workspace = true, optional = true }
sp-io = { workspace = true }
sp-runtime = { workspace = true }

[dev-dependencies]
client-registry-core = { path = "../../crates/client-registry-core" }
constitution-core = { path = "../../crates/constitution-core" }
pallet-assets = { workspace = true, default-features = true }
pallet-balances = { workspace = true, default-features = true }
sp-core = { workspace = true, default-features = true }

[features]
default = ["std"]
std = [
  "frame-benchmarking?/std",
  "frame-support/std",
  "frame-system/std",
  "futarchy-primitives/std",
  "pallet-assets/std",
  "pallet-balances/std",
  "pallet-client-registry/std",
  "pallet-conditional-ledger/std",
  "pallet-market/std",
  "parity-scale-codec/std",
  "question-service-core/std",
  "scale-info/std",
  "sp-io/std",
  "sp-runtime/std",
]
runtime-benchmarks = [
  "dep:frame-benchmarking",
  "frame-benchmarking/runtime-benchmarks",
  "frame-support/runtime-benchmarks",
  "frame-system/runtime-benchmarks",
  "pallet-client-registry/runtime-benchmarks",
  "pallet-conditional-ledger/runtime-benchmarks",
  "pallet-market/runtime-benchmarks",
  "pallet-assets/runtime-benchmarks",
  "sp-runtime/runtime-benchmarks",
]
try-runtime = [
  "frame-support/try-runtime",
  "frame-system/try-runtime",
  "pallet-client-registry/try-runtime",
  "pallet-conditional-ledger/try-runtime",
  "pallet-market/try-runtime",
  "sp-runtime/try-runtime",
]
