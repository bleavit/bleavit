# npm advisory waivers — the accepted risk in `app/pnpm-lock.yaml`.
#
# 14 §3.6 TH-44 (*Frontend supply-chain compromise*) names "`npm audit`/OSV CI"
# among its mitigations. `tools/ci/check-npm-advisories.py` is that leg. It fails
# on EVERY osv-scanner finding in a committed npm lockfile that is not waived
# below — nothing is skipped, because unlike the cargo side there is no second
# scanner standing behind this one.
#
# Every waiver states the pin that forces it and the condition that clears it. A
# waiver that stops matching any finding FAILS the gate (see the checker's
# stale-waiver leg): an exemption can never outlive the advisory that justified
# it, mirroring the limit-coverage registry discipline (SQ-155). The version is
# part of the key, so a dependency bump makes the waiver stale and demands a
# fresh triage rather than silently carrying the old reasoning forward.
#
# `reaches_bundle` is required on every entry and `"yes"` is REFUSED at load
# time. One pnpm workspace holds all 50 projects, so this lockfile carries the
# client packages a browser executes and the tooling that builds and measures
# them, and the lockfile cannot tell them apart. TH-44's impact is "hostile code
# in the bundle"; a package that reaches the bundle IS that threat and gets
# patched rather than excused.

[[waiver]]
id = "GHSA-8988-4f7v-96qf"
aliases = ["CVE-2026-54285"]
package = "@opentelemetry/core"
version = "1.30.1"
severity = "moderate"
reaches_bundle = "no"
# Unbounded memory allocation while parsing a W3C `baggage` propagation header
# (CWE-770). CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:L — availability only, no
# confidentiality or integrity impact. OSV gives the affected range as
# `introduced: 0, fixed: 2.8.0`, so the whole 1.x line is affected and there is
# no 1.x backport to move to.
#
# CONTAINMENT — VERIFIED, NOT ASSERTED. SQ-985 recorded the claim that this
# "arrives under Lighthouse in tools/render-budget" as unverified. Four checks,
# all run 2026-08-07:
#
#   1. `pnpm why -r "@opentelemetry/core"` names exactly ONE workspace project of
#      the 50: `@bleavit/render-budget` (app/tools/render-budget), by the path
#      lighthouse 12.8.2 -> @sentry/node 9.47.1 -> @opentelemetry/core 1.30.1.
#   2. `lighthouse` is declared in exactly one package.json in the repository,
#      that same one.
#   3. `app/.npmrc` pins `node-linker=isolated`, so the package is not resolvable
#      from any workspace project that does not declare it. `app/pnpm-workspace.yaml`
#      makes render-budget a member for precisely this reason: Lighthouse launches a
#      browser and opens a network connection, and confining it keeps it outside the
#      reach of the packages 10 §10.1 keeps thin.
#   4. The decisive one: `pnpm run build && pnpm run release:build` produced the
#      31-file `dist/` tree, and a case-insensitive recursive grep for
#      "opentelemetry", "@sentry" and "lighthouse" across it matched NO file.
#
# So this is build-and-measurement tooling. It is not in the bundle, not in the
# service worker, and not in the desktop shell's embedded tree, which is `dist/`.
#
# NOT FIXABLE WITHOUT A SPEC RULING. @sentry/node 9.47.1 declares
# `"@opentelemetry/core": "^1.30.1"` as a hard dependency, so 2.8.0 is outside
# its range and no `pnpm update` reaches it. The fix exists one major version up
# — lighthouse 13.4.1 depends on @sentry/node ^10.0.0 and resolves
# @opentelemetry/core 2.10.0, confirmed by a probe install — but 10 §9.4's
# first-meaningful-render row is written against Lighthouse **12.8.2** by name
# and by behavior: it binds to First Contentful Paint "because Lighthouse's own
# `first-meaningful-paint` audit yields no numeric value in 12.8.2". Bumping the
# measurement tool across a major re-baselines a published budget and may
# invalidate that stated reason, which is an R-1 spec change rather than a
# dependency bump. It also cannot be verified here: `check:render-budget` needs a
# Chrome this workstation does not have.
#
# Residual risk: an attacker who can reach a `baggage` header on a Sentry-
# instrumented server process could force an unbounded allocation. Nothing here
# is a server. Lighthouse's Sentry reporting is opt-in and unconfigured, the tool
# runs only in CI and only against a loopback static server, and its failure mode
# is a red gate rather than a shipped artifact.
reason = "build-and-measurement tooling only, proven absent from the built dist/ tree; availability-only advisory with no 1.x fix"
blocked_by = "lighthouse 12.8.2 -> @sentry/node 9.47.1 -> @opentelemetry/core \"^1.30.1\" (hard dependency; the fix is 2.8.0, outside the range)"
clears_when = "app/tools/render-budget moves to lighthouse >= 13.4.1, which resolves @opentelemetry/core 2.10.0 — gated on re-ruling 10 §9.4's binding to Lighthouse 12.8.2 and on a green check:render-budget under the new major"
triaged = "2026-08-07"

[[waiver]]
id = "GHSA-jmr9-qjv8-65gv"
aliases = ["CVE-2026-56876"]
package = "extract-zip"
version = "2.0.1"
severity = "high"
reaches_bundle = "no"
# `extract-zip` accepts a symlink target that escapes the destination directory.
# GitHub reviewed the advisory on 2026-08-12 and lists every published release
# (`<= 2.0.1`) as affected, with no patched version.
#
# CONTAINMENT — VERIFIED 2026-08-13:
#
#   1. `pnpm -C app why -r extract-zip` names one path in one of the 50 workspace
#      projects: @bleavit/render-budget -> lighthouse 12.8.2 -> puppeteer-core
#      24.43.1 -> @puppeteer/browsers 2.13.2 -> extract-zip 2.0.1.
#   2. Lighthouse is declared only by `app/tools/render-budget/package.json`.
#      `app/.npmrc` uses the isolated linker, so this dependency is not resolvable
#      from the application packages.
#   3. CI installs Chromium through Debian after the release manifest is recorded;
#      it does not ask Puppeteer to download or unpack a browser. The render gate
#      launches that exact `/usr/bin/chromium` through `chrome-launcher` and passes
#      its path in `CHROME_PATH`, so the affected extraction code is not executed.
#   4. A release build followed by a recursive search of `app/dist` contains none
#      of `extract-zip`, `@puppeteer/browsers`, `puppeteer` or `lighthouse`. The SBOM
#      still discloses the workspace tool dependency, as it should.
#
# Residual risk is confined to a future tooling change that starts using
# @puppeteer/browsers to unpack an attacker-controlled archive. The current gate's
# explicit Debian installation and CHROME_PATH make that precondition unreachable;
# a dependency or workflow change must re-triage because this waiver is version-keyed
# and the exit condition below is mechanically checked for staleness.
reason = "Lighthouse-only measurement dependency; isolated from app packages, absent from dist, and its browser-extraction path is not executed"
blocked_by = "lighthouse 12.8.2 -> puppeteer-core 24.43.1 -> @puppeteer/browsers 2.13.2 -> extract-zip 2.0.1; GitHub lists no patched extract-zip release"
clears_when = "extract-zip publishes a non-affected version admitted by @puppeteer/browsers, or Lighthouse/Puppeteer removes extract-zip from the measurement-tool graph"
triaged = "2026-08-13"
