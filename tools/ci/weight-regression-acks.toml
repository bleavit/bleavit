runtime/bleavit-runtime/src/weights/pallet_epoch.rs drive_oracle_boundaries: SQ-492: +32 writes - exactly one ComponentReapBatch (13 §2) - and +27.63% ref_time. The crank gained 07 §13's settled-value reaping sweep, which had no driver anywhere before this branch, so ComponentValues grew by one entry per admitted component per epoch until MAX_COMPONENT_VALUES turned every further settlement into AlreadyFinal: a wedge of the whole oracle rather than a leak. Two thirds of the ref_time delta is not the sweep at all but the fixture: prime_oracle_state previously seeded ZERO ComponentValues, so every Oracle::load in this crank - the deadline drives included - hydrated an empty map and the committed weight understated a permissionless call against a 128-entry bound. It is now seeded to the bound, in two generations per component so the per-component carry checkpoints do not make the reapable set empty (#175 review). The proof-size estimate is unchanged at 356,514 B across 48 -> 128 seeded entries, measured both ways: the additional 80 reads add nothing to the estimate the PoV budget test checks, because ComponentValues is already accounted at its ceiling by the load() scans. The benchmark asserts the sweep retired a full batch (assert_oracle_components_reaped), because the failure mode of a fixture that never reaches the new code is a green weight file reporting no change at all - the fourth instance of that shape here (SQ-489, SQ-490, SQ-495).
