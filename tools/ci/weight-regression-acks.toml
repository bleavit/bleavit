# E2 (2026-07-29) — the market Sweep's revenue leg. This entry only became
# *reachable* when E1 merged: `check-weight-regression.py` diffs against
# `git merge-base HEAD origin/main`, and while that base predated E1 the function
# did not exist there at all — a new function has no baseline and cannot regress.
# The moment E1 landed, `sweep_revenue` acquired one, and this is the first run
# that could see the delta. Worth remembering: a stacked PR's weight gate is
# blind to every function its own base introduces.
#
# **The whole increase is one added ledger walk, and it reconciles exactly.**
# E1's sweep performed a single `withdraw_book(&book, .., &treasury)` — the POL
# return. E2 runs `market_core::withdraw_fees(&book, .., &main)` *before* it, a
# structurally identical walk of the same 14 proposal instruments for a different
# owner (the fee account instead of the treasury), because 04 §6.1 makes the fee
# account's realizable claims remit 100 % to `MAIN`. Hence `Positions`
# r:14 w:14 -> r:28 w:28: two owners x 14 instruments, a fixed count, not a scan.
# Every remaining unit is a named key: `PositionCount` +1r/+1w (the second
# owner's), `ForeignAssets::Account` +1r/+1w (`withdraw_baseline_fee_usdc` moving
# the Baseline book's retained plain USDC above the 03 §7 R-4 `min_balance`
# floor), `Constitution::Params` +2r (the `ledger.rdm_fee` / `ledger.min_split`
# overlay every `LedgerState` construction now reads), `RedemptionFeesAccrued`
# +1r, and `FutarchyTreasury::PendingMainCredit` +1r/+1w. Those sum to exactly
# +20 reads and +17 writes, with nothing unaccounted.
#
# **Why the cost is not optional.** Reaching `MAIN` custody is only half the job:
# `nav()` is computed from the treasury's internal `main_usdc` counter, not from
# asset balances, so value that arrives without a `credit_main` is invisible to
# NAV — which is the exact shape of the POL custody leak E1 exists to close. The
# `PendingMainCredit` read/write is what makes the arrival recognized. Dropping
# it would restore a silent leak in the over-permissive direction.
#
# PoV: 72,866 bytes, inside 13 §5's budget (`check-weight-storage-bounds.py`
# green in the exhaustive gate). ref_time 752 us is ~0.04 % of a 2 s block. The
# call is permissionless, so the relevant risk is griefing — but it is
# idempotent behind the `SweptMarkets` marker (04 §2: exactly one `RevenueSwept`
# per market), so a repeat call is refused rather than re-charged.
runtime/bleavit-runtime/src/weights/pallet_market.rs sweep_revenue @ ref_time=857390000, proof_size=72866, reads=72, writes=55: E2, plus one read from E4 and a worst-case fixture correction from SQ-520. **The ref_time line is SQ-520 and nothing else.** 15 §4.5 requires this fixture to be the heaviest terminal, and it measured the *settled* one; under `Voided` the fee account holds a paying position on both branches (D-1 pays every branch half), so `withdraw_fees` performs two `do_redeem_void` operations against the settled arm's single winning-branch `do_redeem`. Re-pointing the fixture at the `Voided` terminal moves ref_time 773,310,000 -> 857,390,000 (+10.9 %) and moves **nothing else**: reads 72, writes 55 and estimated PoV 72,866 are identical on both terminals, because both walk the same fixed instrument universe and only the work over it differs. That precision matters — the review that raised this described the committed weight as omitting the second redemption "outright", which is true of execution time but not of the block-bounding dimensions the settled fixture already covered. The Baseline terminal is lighter than both (a two-instrument vault through one `do_redeem_baseline_pair`), so it is not the fixture. 857 us is ~0.043 % of a 2 s block. The 04 §6.1 fee leg adds one `withdraw_fees(.., &main)` ledger walk ahead of E1's `withdraw_book(.., &treasury)` POL return — the same 14 proposal instruments for a second owner, so `Positions` goes r:14 w:14 -> r:28 w:28 (a fixed count, not a scan). The rest are named keys: `PositionCount` +1r/+1w for the second owner, `ForeignAssets::Account` +1r/+1w for the Baseline book's retained plain-USDC remittance above the 03 §7 R-4 `min_balance` floor, `Constitution::Params` +2r for the `ledger.rdm_fee`/`ledger.min_split` overlay, `RedemptionFeesAccrued` +1r, and `PendingMainCredit` +1r/+1w. Exactly +20 reads and +17 writes for that leg, nothing unaccounted. **One further read, +1, is E4/SQ-517**: `Market::FrozenUntil`, the 06 §6.3 freeze guard the two Track-E revenue cranks acquired — the fee leg redeems through the ledger's *internal* path, which carries no `Frozen` check, so without it the protocol would collect its own claim out of a possibly-short sovereign while every claimant's `redeem` is refused. It is a single `OptionQuery` value read on a call that already performs 71, and the estimated PoV does not move at all (72,866 B before and after) because the key fits inside the existing bound; only `Measured` shifts 15,020 -> 15,062. Total +21 reads and +17 writes against the merge base. The `PendingMainCredit` write is load-bearing rather than incidental: `nav()` reads the treasury's internal `main_usdc` counter and not asset balances, so USDC that reaches `MAIN` without `credit_main` never reaches NAV — the precise shape of the custody leak this track closes. PoV 72,866 B is inside 13 §5's budget and the call is idempotent behind the `SweptMarkets` marker, so the permissionless surface cannot be re-charged.

# --- SQ-518: the 08 §1.2 automatic INSURANCE overflow on the USDC slash paths ---
#
# `adjudicate` is the oracle's reporter-bond slash. Its writes move 8 -> 10 and
# its reads 478 -> 481; only the writes cross the 10 % limit (+25 % on a small
# base), and all five units reconcile to named keys with nothing unaccounted:
#
#   ForeignAssets::Account   +1r/+1w  the INSURANCE -> MAIN transfer touches
#                                     MAIN's account row
#   SweptResidueUnreclaimed  +1r      the liability term of `T_ins`, read to
#                                     derive the target and the surplus
#   PendingMainCredit        +1r/+1w  `credit_main` — the accounting half, and
#                                     the load-bearing one: `nav()` reads the
#                                     treasury's internal counter, not asset
#                                     balances, so USDC that reaches MAIN
#                                     without this write never reaches NAV
#
# Why the cost is taken at all: 08 §1.2 requires above-target USDC to overflow
# to MAIN "automatically, in the same transaction as the inflow ... no crank for
# those", naming slash proceeds explicitly. The permissionless
# `reconcile_insurance` exists one bullet later for *direct* transfers, which
# cannot be intercepted; it is a backstop, not the intended path here.
#
# Why it cannot grief: the added work is O(1) and bounded — three named
# single-value reads and two writes, no scan — and it runs only on a path that
# already performs 478 reads to adjudicate a dispute. The overflow itself is a
# no-op at or below target, so the common case adds a comparison and nothing
# else. The call is not permissionless.
#
# Direction of error, deliberately chosen: the overflow is best-effort at the
# call site, inside its own storage layer. The slash is the security-critical
# act and must not be voided by a cleanup failure (G-1); anything left above
# target is exactly what the crank clears. The layer is what keeps that safe —
# `overflow_insurance` credits `main_usdc` before moving custody, so swallowing
# the error without a layer would retain the credit and overstate NAV against
# custody that never moved.
runtime/bleavit-runtime/src/weights/pallet_oracle.rs adjudicate @ writes=10: SQ-518. The 08 §1.2 automatic INSURANCE overflow now runs in the reporter-bond slash's own transaction. +2 writes reconcile exactly: `ForeignAssets::Account` +1w for the INSURANCE -> MAIN transfer and `PendingMainCredit` +1w for `credit_main`, the accounting half without which USDC reaching MAIN never reaches `nav()`. Reads move 478 -> 481 (+0.6 %, under the limit) for the same two keys plus `SweptResidueUnreclaimed`, the liability term of `T_ins`. The three keys are named singletons, not a scan. **The per-call O(1) claim needed qualifying and now carries it:** `pallet_oracle::apply_custody` calls `slash_insurance` *inside* its loops over reporters and watchtowers, once per stake reduction, so the overflow can run several times in one `adjudicate` rather than once. That does not move these dimensions, and the reason is specific rather than lucky: every iteration touches the **same** keys — `ForeignAssets::Account` for INSURANCE and MAIN, `PendingMainCredit`, `SweptResidueUnreclaimed` — and the benchmark's storage accounting counts distinct keys, so the totals are invariant in the number of slashed seats. **The ref_time side is stated as a residual, not as coverage** — an earlier version of this acknowledgement claimed the fixture covered it at `MAX_REPORTERS_BOUND - 1` seeded reporters, which is wrong: the fixture calls `adjudicate(.., reporter_wrong = false)`, so `record_reporter_offense` never runs, no reporter stake falls, and **exactly one** `slash_insurance` executes (the `ReporterWins` bond settlement). Seat count drives `apply_custody`'s comparison scan, not the overflow count. A `reporter_wrong = true` adjudication would add an offense slash and so a second overflow; the fixture measures one. That does not move this acknowledgement, whose dimensions are storage and are count-invariant for the reason above, but it means ref_time here is a measured single-overflow figure rather than a worst-case one. The overflow is a no-op at or below target, so a second iteration does no writes unless its own slash lifted INSURANCE above `T_ins` again. Best-effort inside its own storage layer so a cleanup failure cannot void a confiscation (G-1) and cannot leave `main_usdc` credited against custody that never moved.

# --- Re-measurement variance surfaced by the E4 regeneration sweep ---
#
# `qualify_recovery_image` is component-bearing in `b` (payload bytes, high
# 4,194,304). Its **storage dimensions did not move at all** — reads 17,
# writes 3, estimated PoV `103128 + b * 1`, identical before and after. What
# moved is ref_time: base 254,510,000 -> 257,380,000 (+1.1 %) and the per-byte
# slope 2,268 -> 2,592 (+14.3 %), which the gate compounds into a worst-case
# 9,767,191,472 -> 11,129,015,968 (+13.9 %) at the component high.
#
# This is measurement variance on **unchanged code**, not a regression. Both
# `pallets/execution-guard/` and `crates/execution-guard-core/` are byte-
# identical to the merge base on this branch (`git diff --stat <base>` is
# empty) and no commit touches `qualify_recovery_image`. The function was
# re-measured only because it shares `pallet_execution_guard.rs` with
# `expire_failed_execution` and `reject_stale`, whose bond-slash paths genuinely
# gained the 08 §1.2 INSURANCE overflow (SQ-518) — regeneration is per file, so
# an untouched neighbour is re-measured with them.
#
# ref_time is the dimension `regenerate-weights.py` calls advisory "always"
# precisely because of this spread (127 % measured on unchanged code); a
# per-byte slope fitted over a 4 MiB range is the noisiest quantity in the whole
# weight set. The block-bounding dimensions — the ones that are exact — did not
# change, which is the evidence that nothing structural happened here.
runtime/bleavit-runtime/src/weights/pallet_execution_guard.rs qualify_recovery_image @ ref_time=11129015968: E4 regeneration sweep. Re-measurement variance on code this branch does not touch: `pallets/execution-guard/` and `crates/execution-guard-core/` are byte-identical to the merge base and no commit touches this function. Storage dimensions are unchanged (reads 17, writes 3, PoV `103128 + b * 1`); only ref_time moved, base +1.1 % and the per-byte slope 2,268 -> 2,592, compounding to +13.9 % at the 4,194,304-byte component high. It was re-measured only as a file-neighbour of `expire_failed_execution`/`reject_stale`, which genuinely gained the SQ-518 overflow. ref_time is advisory in the drift gate for exactly this reason (127 % measured spread on unchanged code), and a slope fitted across a 4 MiB range is the noisiest quantity in the set.
runtime/bleavit-runtime/src/weights/pallet_oracle.rs crank_round_close @ ref_time=3193098962: Contract v18 (oracle security). The increase is a **fixture correction, not a slowdown**: the benchmark previously measured the wrong branch. `crank_round_close` seeded `n` reports and then `fill_ack_capacity(16, 16)`, saturating watchtower acks, so every round closed through the `Unchallenged` arm and the 07 §5.3 **default** branch was never measured at all. 15 section 4.5 forbids weighing a batched crank on an undersized fixture, and the growth-only regression gate structurally cannot see work that was never measured — the SQ-490 class. The fixture now issues a real `challenge` for each of the `n` components from one non-reporter account, so every round closes on the default branch, and the benchmark asserts every settled entry is `SettlePath::Neutral` with `flagged: true` so a future fixture edit cannot silently fall back to the cheaper arm. That branch is strictly the heavier one, and after this PR more so: it scans the settled history for the 07 section 10 carry value (`last_valid_value`, up to `MAX_COMPONENT_VALUES` = 128 hydrated entries), emits an extra `NeutralSettlement`, and settles a bond stack whose round-1 disposition performs an INSURANCE transfer. **The evidence that this is structural and not re-measurement noise is the shape of the fit, not the headline number.** The per-round slope moves 51,312,035 -> 123,620,566 (2.4x) while the intercept barely moves (1,828,845,989 -> 1,956,893,302, +7.0 %), which is exactly what per-round work that was previously unmeasured looks like; a noisy re-run moves the intercept, not the slope. The fit also *tightens* rather than loosening — Standard Error 1,366,514 -> 469,648 — because the default branch is the branch the fixture now actually varies `n` over. Worst case at the component high (n = 10) is therefore 2,341,966,339 -> 3,193,098,962 (+36.34 %). The storage dimensions move with it and are accounted: reads 501 -> 505 (+4) and writes 9 + 3n -> 11 + 3n, i.e. 39 -> 41 at n = 10 (+2) — one read is the new `ReporterRecords` hydration in `load()`, which every function in this pallet pays, and the rest are the default branch's carry scan and bond settlement. Estimated PoV is unchanged at 356,514 B. 3.19 ms is ~0.16 % of a 2 s block for a batch of up to `MaxRoundCloseBatch` rounds. Accepting this number is what makes the crank charge for the branch it actually runs; the previous figure charged for a branch an attacker could simply not take. **A caution for whoever re-pins this next:** ref_time on this box carries a wide run-to-run spread under CPU contention — an earlier regeneration of this same fixture, taken while another benchmark run shared the machine, read the intercept ~35 % higher and a neighbouring function ~60 % higher, both of which vanished on a quiet re-run. Re-measure on an idle box before concluding anything from an intercept move; the slope and the storage dimensions are the stable signals.
