# Intentional weight-regression acknowledgements.
#
# Format (one function/removal per line):
# <repo-relative-weight-path> <function>: <non-empty justification>
# <repo-relative-weight-path> *: <non-empty whole-file-removal justification>
#
# Example (keep commented unless the regression is intentional):
# runtime/bleavit-runtime/src/weights/pallet_constitution.rs set_param: storage proof grew after adding validation
# runtime/bleavit-runtime/src/weights/pallet_retired.rs *: pallet retired by approved migration
#

# SQ-182/SQ-491 — `pallet_oracle`. One structural change, measured, in the safe
# direction. `Oracle::load()` now hydrates the new `RoundActivity` latch (07 §4),
# so **every** oracle extrinsic gains exactly +1 read — 485→486, 477→478, 489→490,
# 479→480, 491→492, 499→500, 515→516, 486→487 across the twelve — and `report`
# additionally gains +1 write (5→6) for the latch itself. Those counts are the
# whole of the intended cost.
#
# The ref_time percentages are only partly explained by it, and the honest account
# is: the committed baseline was generated 2026-07-25 on this same machine, so this
# is not accumulated drift; two consecutive full runs of the *identical* new code
# differ by up to 5.0% across these twelve functions (adjudicate 1,901M vs 1,806M),
# every one reading lower on the second run; one extra host-side storage read inside
# the measured section accounts for a further small share. A residual of a few
# percent is unexplained and is recorded as unexplained rather than argued away.
#
# (That 5% band is specific to these functions, which are all ~1.8 s calls. The same
# two-run experiment on `pallet_epoch` spread from -54.8% to +65.5% on its smaller
# calls — see the `set_intake_paused` entry below. Percentage gates are close to
# meaningless below roughly a millisecond of measured work on this machine.)
#
# The values adopted are the **higher** of the two measured runs, deliberately:
# understating a permissionless call is the block-capacity surface the gate exists to
# catch (R-7; 15 §4.5), and an overstatement costs block space, not safety. SQ-490
# tracks the absent CI leg that lets this class of question arise at all.
runtime/bleavit-runtime/src/weights/pallet_oracle.rs counter_report: SQ-182/SQ-491 — +1 read (489 -> 490) from the new RoundActivity hydrate in Oracle::load; ref_time 1,678M -> 1,873M (+11.62%). Identical-code rerun measured 1,831M, i.e. 2.2% below the adopted value, so up to ~5% of this is run-to-run variance on this machine; the baseline is same-day and same-machine, so none of it is drift. Adopted the higher run.
runtime/bleavit-runtime/src/weights/pallet_oracle.rs deregister_reporter: SQ-182/SQ-491 — +1 read (479 -> 480) from the same hydrate; ref_time 1,593M -> 1,807M (+13.47%). Identical-code rerun measured 1,794M (-0.8%). This call does not touch the latch at all, so its movement is the hydrate plus variance, not new work on its own path. Adopted the higher run.
runtime/bleavit-runtime/src/weights/pallet_oracle.rs register_reporter: SQ-182/SQ-491 — +1 read (491 -> 492) from the same hydrate; ref_time 1,707M -> 1,888M (+10.61%). Identical-code rerun measured 1,850M (-2.0%). Same reasoning as deregister_reporter. Adopted the higher run.
