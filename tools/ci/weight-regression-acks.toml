runtime/bleavit-runtime/src/weights/pallet_welfare.rs record_daily_gate: SQ-493: ref_time +21.0%, reads 77 -> 98, writes 61 -> 81 -- the same two causes as record_snapshot on the same shared fixture (interior component values plus the 12-weighted-term spec distribution, and the SnapshotContexts mirror through persist). C_daily itself is unchanged by 07 Section 10: the daily gates settle the gate markets and no attested value may move a gate flag (05 Section 4.7), so the recompute is settlement-time W only.
runtime/bleavit-runtime/src/weights/pallet_welfare.rs register_spec: SQ-493: ref_time +21.7%, reads 73 -> 94, writes 57 -> 77. No new work in the call: its setup fills the snapshot window, so it pays the SnapshotContexts mirror (+20/+20 through persist) and the interior-value fixture like the other two. The spec-set validation it measures is unchanged in shape -- still 16 components, still one weight-sum check per pillar group.
