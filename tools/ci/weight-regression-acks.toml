# Intentional weight-regression acknowledgements.
#
# Format (one function/removal per line):
# <repo-relative-weight-path> <function> @ <dim>=<value>[, ...]: <justification>
# <repo-relative-weight-path> *: <non-empty whole-file-removal justification>
#
# Pinnable dimensions: ref_time, proof_size, reads, writes — the four worst-case
# totals the gate compares. A function entry MUST pin every dimension it accepts.
# `check-weight-regression.py` prints the exact line to paste when it fails, so
# the integers never have to be transcribed by hand:
#
#   to accept: runtime/.../pallet_attestor.rs remove_for_cause @ reads=261, ...
#
# Why pins are mandatory (SQ-490 item 4): an unpinned entry authorizes *any*
# future regression on that function. That was only tolerable because a stale
# entry was fatal, which forced a manual prune after every merge — thirteen of
# them before this change. Entries now behave by case:
#
#   * pinned values match the measured regression -> accepted
#   * pinned values differ                        -> FAIL (the justification was
#                                                    written for another number)
#   * no regression, function still present       -> OBSOLETE: warns, does not
#                                                    fail. This is the state every
#                                                    entry reaches the moment its
#                                                    PR merges and its regression
#                                                    lands in the baseline. Safe to
#                                                    leave; delete when convenient.
#   * entry names a function/file that is absent  -> FAIL (may mask a rename or
#                                                    a move)
#
# Example (keep commented unless the regression is intentional):
# runtime/bleavit-runtime/src/weights/pallet_constitution.rs set_param @ proof_size=4273: storage proof grew after adding validation
# runtime/bleavit-runtime/src/weights/pallet_retired.rs *: pallet retired by approved migration
#
# ---------------------------------------------------------------------------
# The 38 entries SQ-490's weight sweep needed were removed here: #180 merged, so
# each of those regressions is now in the baseline and every entry was obsolete.
# Their justifications are preserved in that PR and in PLAN.md's SQ-490 row —
# this file is a gate control, not an archive.
# ---------------------------------------------------------------------------

# MAX-01 / MAX-08 (2026-07-27) — the whole-repository security review's welfare
# remediation. Three functions regress, and every read in every delta is
# accounted for by a named key.
#
# **The shared +80.** `MAX_SNAPSHOTS` moves 20 -> 60 records. 13 §4 bounds the
# retained window in *epochs* while `Snapshots` is keyed `(epoch, spec_version)`
# and capacity is enforced against records, and each retained epoch can need one
# record per cohort measuring it (05 §3.3's `epoch.horizon_k` = 2) plus one for
# its own active spec, which need not be either of theirs. Conflating the two
# left more lawful records than slots at every activation boundary, which is
# what made a permanent `SnapshotDeadline` wedge reachable with one extrinsic.
# Every welfare dispatch loads the state through `Self::mutate`, so all three
# saturated fixtures grow with the bound: `Welfare::Snapshots` 21 -> 61 and
# `Welfare::SnapshotContexts` 21 -> 61, exactly +80 reads. Same scan, at the
# capacity the bound now honestly admits. `GateBreachFlags` is epoch-keyed and
# stays at 21.
#
# **`record_snapshot`'s extra +5.** MAX-01 also binds the named `spec_version`
# to the epoch's admissible set, which is runtime state: the projection walks
# `Epoch::CohortSchedules` (bounded by `MAX_NON_TERMINAL_COHORTS`; measured r:5)
# and checks `Welfare::MetricSpecs` per bound version, already charged at r:17.
# Without it a signed caller could spend the epoch's spare slot on an
# `(epoch, version)` pair no consumer ever reads. 621 -> 706 is +80 +5, with
# nothing unaccounted.
#
# **Why these numbers and not an earlier "no change".** A first `--check` run
# reported PASS against a benchmark wasm that predated these changes: the
# `runtime-benchmarks` build could not compile them at the time, so the run
# re-measured a stale artifact and the drift was invisible. The Codex review is
# what caught that. These values come from a rebuilt benchmark runtime at the
# committed 50x20 fidelity.
#
# PoV stays inside 13's budget (`check-weight-storage-bounds.py` green) and the
# largest ref_time — `record_snapshot` at 2.68 ms — is ~0.13 % of a 2 s block.
runtime/bleavit-runtime/src/weights/pallet_conditional_ledger.rs merge_baseline @ proof_size=8811, reads=17: E4. Cost of making `ledger.redeem_fee` a LIVE parameter rather than a compile-time constant: 13 §1 defines it as a PARAM row, so `.claude/rules/runtime-code.md` rule 4 forbids hardcoding it, and every dispatch that constructs `LedgerState` therefore reads `Params[ledger.rdm_fee]` (and `ledger.min_split`, which the §5.3a small-payout waiver needs) to overlay the fee config. That is the whole of the increase — the added reads are two named constitution keys, not an unbounded scan, and they are charged identically on paths that never collect a fee because the overlay happens before the dispatch knows whether it will. The alternative — a compile-time rate — would be a rule-4 defect and would silently ignore a lawful governance amendment, which is the unsafe direction for a fee the constitution is supposed to control.
