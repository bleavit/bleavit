runtime/bleavit-runtime/src/weights/pallet_epoch.rs decide: SQ-494: 270 -> 655 reads, decomposing exactly as 128 Rounds scanned + 128 RoundSchedules + 128 ComponentValues + 1 dis.merit_min Params read. Only the 128 ComponentValues reads are this change; the other 257 are 07 §12's ProcessHold predicate being measured for the first time. The decide benchmark seeded ZERO Rounds, so the predicate iterated an empty map and a decision-critical permissionless crank was charged nothing for a scan bounded at 128 rounds with two reads per matching one (the fifth instance of the fixture-instead-of-work shape here: SQ-489, SQ-490, SQ-495, SQ-492). All 128 seeded rounds carry the proposal's frozen version. 02 §7.2 decomposes the bound as 16 components x <= 4 settling epochs x <= 2 versions, suggesting <= 64 per version, but that 4-epoch factor holds only once 07 §11(1)'s retained rounds are reaped -- which they were not before SQ-492 (#175), so a 64/64 split measured 527 reads and undercharged by half (#176 review). With #175 merged the factor is true again and 128-on-one-version is no longer reachable, so the fixture is now conservative rather than exact; it stays, because the larger figure cannot under-charge. The seeded rounds clear the merit floor and are money-settled, the true worst case: `.any()` short-circuits on the first holding dispute, so a full scan returning false is the expensive path. Proof estimate is 356,514 B at both 64/64 and 128/0 -- identical, because RoundSchedules and ComponentValues are already accounted at their ceilings -- so the undercharge was in reads and ref_time, not proof size; the 13 §5 decide PoV pin moves 231,055 -> 404,514 B with its ceiling 384 -> 512 KiB, which is 10.3% of the 3,932,160 B normal-class budget beside settle_cohort(5)'s 9.8%.
