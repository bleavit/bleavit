runtime/bleavit-runtime/src/weights/pallet_epoch.rs settle_cohort: SQ-493: ref_time +25.2% (8.92 -> 11.17 s at n = MAX_COHORT_PROPOSALS_BOUND), entirely in the per-proposal coefficient (516,744,988 -> 676,684,514 ps, +31%). That is 07 §10's settlement-time recompute: a cohort whose measurement window carries a two-consecutive-flag streak recomputes both epochs' W without the dropped components, which is 12 weighted-geometric terms x 2 epochs of log2/exp2 per settled item. Reads 815 -> 837 and writes 700 -> 721 are the SnapshotContexts mirror (20 entries) plus MetricSpecs(0), which the fixture must now register because the recompute reads the spec set it renormalizes over. The n-scaled reads/writes are unchanged (34/52 per proposal), so nothing new scales with cohort size. The estimated PoV is unchanged at 183,055 + 30,754n, so the 13 Section 5 settle_cohort(5) pin holds at 384,825 B. Worst case is a NON-EMPTY drop set that still leaves each pillar group populated: dropping every attested component would empty the A pillar and let the composite renormalize instead of evaluating its terms, so the fixture flags exactly one. The benchmark asserts the recompute actually ran (BenchmarkHelper::assert_settlement_renormalized), because the failure mode here is silence.
