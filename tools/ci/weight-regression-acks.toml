# Intentional weight-regression acknowledgements.
#
# Format (one function/removal per line):
# <repo-relative-weight-path> <function>: <non-empty justification>
# <repo-relative-weight-path> *: <non-empty whole-file-removal justification>
#
# Example (keep commented unless the regression is intentional):
# runtime/bleavit-runtime/src/weights/pallet_constitution.rs set_param: storage proof grew after adding validation
# runtime/bleavit-runtime/src/weights/pallet_retired.rs *: pallet retired by approved migration
#
runtime/bleavit-runtime/src/weights/pallet_registry.rs file: SQ-141: Aggregates is keyed (epoch, spec_version), so MAX_AGGREGATES rises 4 -> 8 (4 non-settled epochs x <= 2 concurrent frozen versions, 05 3.3) and the pallet's scoped loader/persist diffs 8 aggregate keys instead of 4. +4 writes on every registry call is exactly that, and it is measured, not estimated.
runtime/bleavit-runtime/src/weights/pallet_registry.rs challenge_filing: SQ-141: same +4 aggregate keys in the scoped loader/persist as `file`. No behavior on this path changed.
runtime/bleavit-runtime/src/weights/pallet_registry.rs ack_observed: SQ-141: same +4 aggregate keys in the scoped loader/persist as `file`. No behavior on this path changed.
runtime/bleavit-runtime/src/weights/pallet_registry.rs crank_close: SQ-141: same +4 aggregate keys in the scoped loader/persist as `file`. No behavior on this path changed.
runtime/bleavit-runtime/src/weights/pallet_registry.rs resolve_challenge: SQ-141: same +4 aggregate keys in the scoped loader/persist as `file`. No behavior on this path changed.
runtime/bleavit-runtime/src/weights/pallet_registry.rs close_epoch: SQ-141: the +4 aggregate keys, one Aggregates prefix read, and the frozen-version gate. close_epoch is now per-version and the first version's close drops the epoch-wide FilingCount, so the anti-griefing guard reads the epoch's aggregate prefix as the second half of its disjunction - without it a sibling version could never be closed. The version gate (frozen set from the epoch seam, plus a bounded filings scan for the late-close case) is the fix for a griefing surface the re-key opened: without it any signed caller could close arbitrary unfrozen version numbers, each consuming one of the eight aggregate slots until the legitimate close failed TooManyAggregates permanently (Codex review, PR #173).
runtime/bleavit-runtime/src/weights/pallet_registry.rs reap_epoch: SQ-141: reap is per-version now. It walks the epoch's filings to enforce the sibling-ordering rule (07 7: a version must not be reaped while a sibling still holds unclosed records, or the epoch's only remaining evidence that it was ever filed is erased) and clears one ack prefix per reaped filing instead of one prefix for the whole epoch, which would destroy a live sibling's acks. Both are the fix for a real defect, not overhead.
runtime/bleavit-runtime/src/weights/pallet_welfare.rs record_snapshot: SQ-141/SQ-341: MetricSpec gained two trailing u32 fields (contract v14), so the MetricSpecs proof grows 3379 -> 3507 B and every spec decode costs more; and the incident-aggregate read is now fail-closed, which costs a FilingCount read plus a bounded scan of the epoch's filings (<= MaxFilingsPerEpoch = 64, reached only after the filing window shuts) to tell 'this version had no filings' (neutral is honest) from 'this version has records that have not closed' (must refuse). Paying for that distinction is the point of the re-key.
runtime/bleavit-runtime/src/weights/pallet_welfare.rs register_spec: SQ-341: register_spec now enforces both halves of 07 2(5) - the Reporters/Watchtowers counted-map reads plus two Constitution::Params reads for orc.n_min/wt.quorum and the live coverage rate - and validates the two new MetricSpec fields per component, over a spec set whose encoded size grew with them. The reporter count iterates Reporters rather than reading the counted-map size, because 07 §3 counts seats holding a FULL stake and a reporter slashed on a second adjudicated-false report stays registered at half stake (Codex review, PR #173). Previously the rule was enforced nowhere and orc.n_min had no consumer at all, so this is new work being measured for the first time rather than the same work costing more.
