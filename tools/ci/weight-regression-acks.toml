# Intentional weight-regression acknowledgements.
#
# Format (one function/removal per line):
# <repo-relative-weight-path> <function>: <non-empty justification>
# <repo-relative-weight-path> *: <non-empty whole-file-removal justification>
#
# Example (keep commented unless the regression is intentional):
# runtime/bleavit-runtime/src/weights/pallet_constitution.rs set_param: storage proof grew after adding validation
# runtime/bleavit-runtime/src/weights/pallet_retired.rs *: pallet retired by approved migration
#
runtime/bleavit-runtime/src/weights/pallet_epoch.rs drive_oracle_boundaries: SQ-492: exactly +32 writes, which is one ComponentReapBatch (13 §2). The boundary crank gained 07 §13's settled-value reaping sweep, which had no driver anywhere before this branch - so ComponentValues grew by one entry per admitted component per epoch until MAX_COMPONENT_VALUES turned every further settlement into AlreadyFinal, wedging the whole oracle rather than merely leaking. The +11.85% ref_time is that batch of removals, the bounded key scan that finds them, and one MoneySettled read - the guard that exempts a value a still-retained round is resting on, since reaping it would leave a live Rounds entry with no settled counterpart and break the 07 §13 try-state invariant. The benchmark asserts the sweep actually retired a full batch (assert_oracle_components_reaped), because the failure mode of a fixture that leaves the map empty is a green weight file reporting no change at all - the fourth instance of that shape in this repo (SQ-489, SQ-490, SQ-495).
runtime/bleavit-runtime/src/weights/pallet_constitution.rs set_param: SQ-495: set_param's worst case is now an amendment to one of 07 §6.3's two coverage inputs, which walks the live MetricSpec set to find the strictest admitted Delta-s-max. The 3 -> 21 reads is that walk being measured for the first time - the previous number came from a synthetic bench.param key that short-circuits the screen entirely, so it measured a call that never does the work (the SQ-489 fixture-instead-of-work shape). Every other key still short-circuits before touching welfare storage, so only the two coverage keys pay it in practice; the benchmark charges all set_param calls the worst case, which is the conservative direction.
