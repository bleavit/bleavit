# Intentional weight-regression acknowledgements.
#
# Format (one function/removal per line):
# <repo-relative-weight-path> <function> @ <dim>=<value>[, ...]: <justification>
# <repo-relative-weight-path> *: <non-empty whole-file-removal justification>
#
# Pinnable dimensions: ref_time, proof_size, reads, writes — the four worst-case
# totals the gate compares. A function entry MUST pin every dimension it accepts.
# `check-weight-regression.py` prints the exact line to paste when it fails, so
# the integers never have to be transcribed by hand:
#
#   to accept: runtime/.../pallet_attestor.rs remove_for_cause @ reads=261, ...
#
# Why pins are mandatory (SQ-490 item 4): an unpinned entry authorizes *any*
# future regression on that function. That was only tolerable because a stale
# entry was fatal, which forced a manual prune after every merge — thirteen of
# them before this change. Entries now behave by case:
#
#   * pinned values match the measured regression -> accepted
#   * pinned values differ                        -> FAIL (the justification was
#                                                    written for another number)
#   * no regression, function still present       -> OBSOLETE: warns, does not
#                                                    fail. This is the state every
#                                                    entry reaches the moment its
#                                                    PR merges and its regression
#                                                    lands in the baseline. Safe to
#                                                    leave; delete when convenient.
#   * entry names a function/file that is absent  -> FAIL (may mask a rename or
#                                                    a move)
#
# Example (keep commented unless the regression is intentional):
# runtime/bleavit-runtime/src/weights/pallet_constitution.rs set_param @ proof_size=4273: storage proof grew after adding validation
# runtime/bleavit-runtime/src/weights/pallet_retired.rs *: pallet retired by approved migration
#
# ---------------------------------------------------------------------------
# The 38 entries SQ-490's weight sweep needed were removed here: #180 merged, so
# each of those regressions is now in the baseline and every entry was obsolete.
# Their justifications are preserved in that PR and in PLAN.md's SQ-490 row —
# this file is a gate control, not an archive.
# ---------------------------------------------------------------------------
