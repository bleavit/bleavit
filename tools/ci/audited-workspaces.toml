# Every committed dependency lockfile in this repository, and the workspace that owns it.
#
# `tools/ci/supply-chain-gates.sh` drives all four of its legs from this file: the
# `cargo metadata --locked` committed-lockfile assertion, the `cargo-audit` RustSec run,
# the `tools/ci/check-ghsa-only.py` GHSA-complement run, and the
# `tools/ci/check-npm-advisories.py` npm run. The gate derives its work list here
# instead of naming lockfiles inline.
#
# THIS FILE IS EXHAUSTIVE. `tools/ci/check-audited-workspaces.py` compares it against
# `git ls-files` over every lockfile name it knows, in every ecosystem, and fails on any
# difference in either direction. A new workspace therefore turns the supply-chain gate
# red until somebody classifies it here, and a deleted one turns it red until somebody
# removes its row.
#
# That comparison exists because the gate used to name its lockfiles inline. It audited
# `Cargo.lock` and `keeper/Cargo.lock`. `app/Cargo.lock` and `fuzz/Cargo.lock` arrived
# later, nothing compared the gate's list against the repository, and both stayed
# unaudited behind a green Supply-chain job for as long as they existed. A coverage hole
# reports as silence rather than as absence, so the list is now derived and checked.
#
# `app/pnpm-lock.yaml` was the same hole one ecosystem over, and it lasted longer: the
# gate knew only about cargo, so widening the cargo list could never have found it.
# Discovery is therefore keyed on ecosystem, and adding one is what admits a new lockfile
# name — `LOCKFILE_NAMES` in the checker is the single place that grows.
#
# ECOSYSTEM decides which legs a row receives:
#
#   cargo — all four cargo legs. `Cargo.lock`.
#   npm   — the osv-scanner npm leg. `pnpm-lock.yaml`, `package-lock.json`,
#           `npm-shrinkwrap.json`, `yarn.lock`, `bun.lock` or `bun.lockb`.
#
# Doc 15 §4.5 clause 4 (blast-radius containment) requires a workspace outside the pinned
# SDK closure to be audited FROM ITS OWN ROOT. `cargo-audit` reads `.cargo/audit.toml`
# from its working directory, so a single run started in the repository root would apply
# the root's stable2606 exception set to every cargo lockfile. Every cargo leg therefore
# runs with its workspace directory as the working directory. Only the root workspace
# owns an exception file, and the other three audit with none — measured, not assumed:
# a `--json` run from each of `app`, `fuzz` and `keeper` reports `settings.ignore = []`.
#
# `audit_config` records that fact per row. A row that gains an exception file also gains
# a reviewer obligation, because an exception written for one workspace must never excuse
# another. npm rows carry no exception file at all: their waivers live in
# `tools/ci/npm-advisory-waivers.toml`, which is per-entry annotated and expires.

[[workspace]]
name = "root"
ecosystem = "cargo"
directory = "."
lockfile = "Cargo.lock"
audit_config = ".cargo/audit.toml"
ships = "the parachain runtime, the collator node, every pallet and the reference crates"
# The only workspace inside the 01 §9 exact-pin regime, and therefore the only one whose
# advisories can be pin-forced. Its annotated exception set lives in `.cargo/audit.toml`
# and is re-triaged from scratch at every SDK train bump (15 §4.5 clause 3).

[[workspace]]
name = "keeper"
ecosystem = "cargo"
directory = "keeper"
lockfile = "keeper/Cargo.lock"
audit_config = ""
ships = "the off-chain keeper binary (01 §4.2)"
# A separate cargo workspace by design: its subxt dependency tree must never perturb the
# runtime workspace's `=`-exact stable2606 pins. Audited with no inherited exceptions,
# which is the worked example doc 15 §4.5 clause 4 names.

[[workspace]]
name = "app"
ecosystem = "cargo"
directory = "app"
lockfile = "app/Cargo.lock"
audit_config = ""
ships = "the F22 Tauri desktop shell (`src-tauri`) and the pure `embedded-tree` crate"
# Excluded from the root workspace so the Tauri stack and its desktop target triples stay
# out of the runtime closure (10 §10.1; `app/Cargo.toml` states the reason). This lockfile
# backs a user-facing binary, so its advisories reach an end user directly rather than an
# operator. Added to the gate 2026-08-07 after it had shipped unaudited.

[[workspace]]
name = "fuzz"
ecosystem = "cargo"
directory = "fuzz"
lockfile = "fuzz/Cargo.lock"
audit_config = ""
ships = "the `bleavit-fuzz` cargo-fuzz targets (S2, N7, N8, N10)"
# Pinned to its own nightly toolchain (`fuzz/rust-toolchain.toml`) so libFuzzer and
# nightly can never perturb the pinned SDK line (15 §4.5). The gate resolves this
# lockfile under the repository's default toolchain instead, for the reason the gate
# script records at its leg 1. Nothing here ships to a user, and the workspace still
# carries the same transitive crates the runtime does, so an advisory here is a real
# signal about the tree even when the binary is a test harness. Added 2026-08-07.

[[workspace]]
name = "app-npm"
ecosystem = "npm"
directory = "app"
lockfile = "app/pnpm-lock.yaml"
audit_config = ""
ships = "the browser bundle every user loads (10 §10.1), plus the app's own build, test and measurement tooling"
# The highest-consequence lockfile in the repository and the last one to be audited by
# anything. 14 §3.6 TH-44 (*Frontend supply-chain compromise*) names "`npm audit`/OSV CI"
# among its mitigations, so this is a spec-mandated control that had no implementation
# until 2026-08-07 — found, like the cargo half, by GitHub's own push notice rather than
# by a gate.
#
# One pnpm workspace holds all 50 projects, so ONE lockfile covers the shipped client
# packages and the build tooling alike. That is why `reaches_bundle` is a required field
# on every npm waiver: the lockfile itself cannot tell a browser dependency from a
# dependency of the tool that measures the browser, and the whole triage turns on which
# one a finding is.

[[workspace]]
name = "explainer-npm"
ecosystem = "npm"
directory = "explainer"
lockfile = "explainer/package-lock.json"
audit_config = ""
ships = "the static teaching site under explainer/ — its build tooling and its browser bundle alike"
# The explainer is not the canonical client (that is `app/`, 10 §10.1) and nothing it renders
# is a place a user signs a transaction. Its bundle is still code a browser executes from a
# Bleavit-published page, so TH-44 reaches it and it is audited on the same terms as `app-npm`.
#
# A SECOND npm PACKAGE MANAGER, DELIBERATELY. `app/` is one pnpm workspace of 50 projects; this
# is a standalone npm project with its own lockfile, so that a dependency added for a teaching
# animation can never enter the tree the canonical client resolves from. The cost of that
# isolation is exactly this row: `LOCKFILE_NAMES` already admitted `package-lock.json`
# precisely so a second manager fails the gate instead of shipping unscanned, and it did —
# this row exists because the coverage check reported the lockfile, not because anyone
# remembered to add it.
