# The single client monorepo (10 §10.1). `src/features/*` are workspace packages,
# not plain folders: their package.json dependencies ARE the §10.2 reference sets,
# and pnpm's isolated node_modules is what makes an undeclared import unresolvable
# rather than merely un-referenced. See .npmrc — node-linker is pinned, not defaulted.
packages:
  - 'packages/*'
  - 'src/application'
  - 'src/features/*'
  # The `verify-release` CLI (12 §1.3) is the one tool that binds to a client package —
  # it decides the release verdict over `packages/verify`'s own `SelfCheckResult`, so the
  # CLI and the in-app self-check cannot disagree about what "matches" means. A member
  # here rather than a root devDependency, for the reason stated above: the root is
  # reachable from every package by the parent-directory walk.
  - 'tools/verify-release'
  - 'tests/firewall'
  - 'tests/depcruise-witness'
  - 'tests/protocol'
  - 'tests/mock-runtime'
  - 'tests/chain-client'
  - 'tests/descriptors'
  - 'tests/transaction-builder'
  - 'tests/verify'
  - 'tests/local-index'
  - 'tests/intents'
  - 'tests/contexts'
  - 'tests/receipts'
  - 'tests/llm-handoff'
  - 'tests/release'
  - 'tests/ui'
  - 'tests/screens'
  - 'tests/providers'
