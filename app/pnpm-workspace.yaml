# The single client monorepo (10 §10.1). `src/features/*` are workspace packages,
# not plain folders: their package.json dependencies ARE the §10.2 reference sets,
# and pnpm's isolated node_modules is what makes an undeclared import unresolvable
# rather than merely un-referenced. See .npmrc — node-linker is pinned, not defaulted.
packages:
  - 'packages/*'
  - 'src/application'
  - 'src/features/*'
  # The `verify-release` CLI (12 §1.3) is the one tool that binds to a client package —
  # it decides the release verdict over `packages/verify`'s own `SelfCheckResult`, so the
  # CLI and the in-app self-check cannot disagree about what "matches" means. A member
  # here rather than a root devDependency, for the reason stated above: the root is
  # reachable from every package by the parent-directory walk.
  - 'tools/verify-release'
  # `tools/snapshot` (10 §8.2/§10.1) is a member for the same reason, and it is the
  # case that proves the comment above: declaring `@bleavit/providers` at the root
  # instead makes it resolvable from `tests/firewall`, where
  # `forbidden-package-edge.ts` proves 10 §10.1's CI-fatal edge by being
  # UNRESOLVABLE — the fixture went from TS2307 to TS2305 (V-167).
  - 'tools/snapshot'
  # `tools/desktop` (F22) is a member for the third instance of the same reason. It runs
  # `packages/verify`'s own `runSelfCheck` over the tree the desktop shell is about to embed,
  # so the build gate and the in-app self-check cannot disagree about what "matches" means.
  - 'tools/desktop'
  # `tools/render-budget` (10 §9.4, F14) is a member for the same reason and one more.
  # Lighthouse is a ~200-package tree that launches a browser; declared at the root it
  # would be resolvable from every client package by the parent-directory walk, so the
  # one dependency in this repository whose job is to open a network connection and
  # start a process would sit inside the reach of the packages 10 §10.1 keeps thin.
  # Confined here, `import 'lighthouse'` is unresolvable everywhere else in `app/`.
  - 'tools/render-budget'
  - 'tests/firewall'
  - 'tests/depcruise-witness'
  - 'tests/protocol'
  - 'tests/mock-runtime'
  - 'tests/chain-client'
  - 'tests/descriptors'
  - 'tests/transaction-builder'
  - 'tests/verify'
  - 'tests/local-index'
  - 'tests/intents'
  - 'tests/contexts'
  - 'tests/receipts'
  - 'tests/llm-handoff'
  - 'tests/release'
  - 'tests/ui'
  - 'tests/screens'
  - 'tests/providers'
  - 'tests/analysis'
  - 'tests/snapshot'
  - 'tests/platform'
